[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-rsi"
version = "0.1.0"
description = "Forge-RSI: a local-first frozen-base continual-learning engine with the SkillForge workbench"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "David Le" }]
dependencies = [
  "mlx>=0.32",
  "mlx-lm>=0.32",
  "transformers>=4.40",
]

[project.optional-dependencies]
pipeline = ["fastapi", "uvicorn", "python-multipart"]
dashboard = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
forge-rsi = "forge_rsi.cli:main"

[tool.setuptools]
packages = ["forge_rsi", "pipeline", "dashboard"]

[tool.setuptools.package-data]
pipeline = ["ui/*"]
dashboard = ["static/*"]
